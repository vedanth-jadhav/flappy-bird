<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
<!-- sprites + sounds: MIT pack by samuel custodio (github.com/samuelcust/flappy-bird-assets) -->
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico">
  <link rel="apple-touch-icon" href="assets/yellowbird-midflap.png">
  <title>flappy bird</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      background: #70c5ce;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Fredoka', 'Space Grotesk', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      position: fixed;
      width: 100%;
    }
    #game {
      position: relative;
      border: 4px solid #1a1a2e;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    @media (max-width: 560px) {
      body { justify-content: flex-start; }
      #game { border: none; border-radius: 0; box-shadow: none; }
    }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #1a1a2e;
      text-align: center;
      padding: 20px;
    }
    #start-screen, #game-over { pointer-events: auto; }
    #game-over { display: flex; flex-direction: column; align-items: center; max-width: 92%; }
    #game-over.hidden { display: none; }
    h1 { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.02em; text-shadow: 0 2px 0 rgba(255,255,255,0.4); }
    #start-screen { display: flex; flex-direction: column; align-items: center; max-width: 92%; margin-top: auto; margin-bottom: 12%; }
    .logo { font-family: 'Press Start 2P', monospace; font-size: clamp(1.7rem, 9vw, 3rem); line-height: 1.25; text-align: center; animation: floaty 2.4s ease-in-out infinite; text-shadow: -3px -3px 0 #1a1a2e, 3px -3px 0 #1a1a2e, -3px 3px 0 #1a1a2e, 3px 3px 0 #1a1a2e, 0 6px 0 rgba(26,26,46,0.9); }
    @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    #medal { margin-top: 0.9rem; width: 74px; height: 74px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2rem; border: 4px solid #1a1a2e; box-shadow: 0 4px 0 rgba(26,26,46,0.9); }
    #medal:empty { display: none; }
    .medal-none { background: radial-gradient(circle at 35% 30%, #e8e8e8, #9a9a9a); color: #5a5a5a; }
    .medal-bronze { background: radial-gradient(circle at 35% 30%, #ffc59b, #cd7f32 70%); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.3); }
    .medal-silver { background: radial-gradient(circle at 35% 30%, #ffffff, #b8c4cc 70%); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.3); }
    .medal-gold { background: radial-gradient(circle at 35% 30%, #ffe98a, #f0b400 70%); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.3); }
    .medal-plat { background: radial-gradient(circle at 35% 30%, #e6fbff, #7de3f4 70%); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,0.3); }
    .score-display { font-family: 'Press Start 2P', monospace; font-size: clamp(1.6rem, 7vw, 2.6rem); font-weight: 400; line-height: 1.2; color: #fff; text-shadow: -3px -3px 0 #1a1a2e, 3px -3px 0 #1a1a2e, -3px 3px 0 #1a1a2e, 3px 3px 0 #1a1a2e, 0 5px 0 rgba(26,26,46,0.9); }
    #playing-ui .score-display { margin-top: 12px; }
    #playing-ui { justify-content: flex-start; padding-top: max(10px, env(safe-area-inset-top)); pointer-events: none; }
    .best-display { font-size: clamp(1rem, 3vw, 1.25rem); opacity: 0.7; margin-top: 0.5rem; font-weight: 600; }
    .new-best { color: #e67e22; font-weight: 700; animation: pop 0.4s ease; }
    @keyframes pop { 0% { transform: scale(0.5); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
    button {
      pointer-events: auto;
      background: linear-gradient(#8fe063, #5cb531);
      color: #fff;
      border: 3px solid #1a1a2e;
      padding: 1rem 2.5rem;
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      font-family: inherit;
      margin-top: 1.5rem;
      transition: transform 0.1s;
      touch-action: manipulation;
      box-shadow: 0 4px 0 #000;
    }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
    .instructions { font-size: clamp(0.875rem, 2.5vw, 1rem); opacity: 0.75; margin-top: 1rem; line-height: 1.5; font-weight: 600; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="game">
    <canvas id="canvas"></canvas>
    <div id="ui">
      <div id="start-screen">
        <button id="start-btn">tap to start</button>
        <p class="instructions" id="howto">tap anywhere to flap</p>
      </div>
      <div id="playing-ui" class="hidden">
        <div class="score-display" id="score">0</div>
      </div>
      <div id="game-over" class="hidden">
        <h1>game over</h1>
        <div class="score-display" id="final-score">0</div>
        <div class="best-display" id="medal"></div>
        <div class="best-display" id="remark"></div>
        <div class="best-display" id="best-score">best: 0</div>
        <button id="restart-btn">play again</button>
      </div>
    </div>
  </div>

  <script>
    'use strict';
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('start-screen');
    const playingUI = document.getElementById('playing-ui');
    const gameOverScreen = document.getElementById('game-over');
    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreEl = document.getElementById('best-score');
    const medalEl = document.getElementById('medal');
    const remarkEl = document.getElementById('remark');
    const MEDALS = [
      [30, 'medal-plat', '★', 'diamond legend!'],
      [20, 'medal-gold', '★', 'gold glider!'],
      [10, 'medal-silver', '★', 'silver soarer!'],
      [5, 'medal-bronze', '★', 'bronze flapper!'],
      [1, 'medal-none', '★', 'baby bird walk!'],
      [0, 'medal-none', '–', 'warmup run!']
    ];
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    // tuned at 60fps units; loop scales by real elapsed time
    const GRAVITY = 0.42;
    const JUMP = -8;
    const MAX_FALL = 13;
    const PIPE_GAP = 185;
    const HITBOX = 0.78;
    const PIPE_WIDTH = 64;
    const PIPE_SPEED = 2.6;
    const PIPE_SPACING_MS = 1500;
    const GROUND_BASE_H = 112; // original sprite ground height at 288 world width
    let GROUND_H = 60;
    let S = 1; // sprite scale: canvas pixels per original 288px-world pixel

    let width = 320, height = 480;
    let bird, pipes, clouds, dbirds, score, bestScore, gameState, lastPipeSpawn, lastTime, wingPhase, overAt, dist, loopRunning;
    let parts, floats, confetti, rings, shake, flash, hitstop;
    let combo, comboPop;
    const MILESTONES = ['nice!', 'on fire!', 'unstoppable!', 'beast mode!', 'legend!', 'godlike!'];

    function resize() {
      const vw = window.innerWidth, vh = window.innerHeight || window.outerHeight || 700;
      let w, h;
      if (vw <= 560) {
        // phone: true fullscreen portrait, edge to edge
        w = vw; h = vh;
      } else {
        w = Math.min(vw * 0.94, 480);
        h = Math.min(vh * 0.9, 720, w * 1.5);
      }
      w = Math.max(240, w);
      h = Math.max(420, h);
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      width = Math.round(w);
      height = Math.round(h);
      S = width / 288;
      GROUND_H = Math.max(60, Math.round(GROUND_BASE_H * S));
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.imageSmoothingEnabled = false;
      if (bird) {
        bird.x = Math.round(width * 0.28);
        bird.radius = Math.max(14, Math.round(width * 0.05));
      }
    }

    function reset() {
      bird = { x: Math.round(width * 0.28), y: height / 2, velocity: 0, radius: Math.max(14, Math.round(width * 0.05)), rotation: 0 };
      pipes = [];
      clouds = [];
      for (let i = 0; i < 7; i++) {
        const far = i < 3;
        clouds.push({ x: Math.random() * width, y: 20 + Math.random() * height * 0.5,
          s: (far ? 0.35 + Math.random() * 0.4 : 0.7 + Math.random() * 0.7),
          v: (far ? 0.1 + Math.random() * 0.2 : 0.3 + Math.random() * 0.45),
          a: far ? 0.55 : 0.92 });
      }
      dbirds = [];
      for (let i = 0; i < 3; i++) {
        dbirds.push({ x: Math.random() * width, y: height * 0.12 + Math.random() * height * 0.25,
          v: 0.5 + Math.random() * 0.5, ph: Math.random() * 6.28, s: 5 + Math.random() * 4 });
      }
      score = 0;
      wingPhase = 0;
      overAt = 0;
      dist = 0;
      parts = []; floats = []; confetti = []; rings = []; shake = 0; flash = 0; hitstop = 0;
      combo = 0; comboPop = 0;
      lastPipeSpawn = 0;
      lastTime = 0;
      scoreEl.textContent = '0';
    }

    function kick() {
      if (!loopRunning) { loopRunning = true; requestAnimationFrame(loop); }
    }

    function showStart() {
      gameState = 'start';
      startScreen.classList.remove('hidden');
      playingUI.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      lastTime = 0;
      kick();
    }

    function spawnPipe() {
      const playH = height - GROUND_H;
      const margin = Math.max(70, playH * 0.22);
      const range = Math.max(40, playH - margin * 2 - PIPE_GAP);
      const gapY = margin + PIPE_GAP / 2 + Math.random() * range;
      pipes.push({ x: width + 10, gapY: gapY, passed: false });
    }

    // public sprite + sound pack (MIT, samuelcust/flappy-bird-assets)
    const SPR = {};
    function loadImg(key, file) {
      const im = new Image();
      im.src = 'assets/' + file;
      SPR[key] = im;
    }
    loadImg('b_up', 'yellowbird-upflap.png');
    loadImg('b_mid', 'yellowbird-midflap.png');
    loadImg('b_down', 'yellowbird-downflap.png');
    loadImg('pipe', 'pipe-green.png');
    loadImg('bg', 'background-day.png');
    loadImg('base', 'base.png');
    loadImg('msg', 'message.png');
    for (let d = 0; d <= 9; d++) loadImg('d' + d, d + '.png');
    function imgOK(im) { return im && im.complete && im.naturalWidth > 0; }
    const SND = {};
    function loadSnd(key, file) {
      try { const a = new Audio(); a.src = 'assets/' + file; a.preload = 'auto'; SND[key] = a; } catch (e) {}
    }
    loadSnd('wing', 'wing.wav');
    loadSnd('point', 'point.wav');
    loadSnd('hit', 'hit.wav');
    loadSnd('die', 'die.wav');
    loadSnd('swoosh', 'swoosh.wav');
    function sfx(key) {
      try {
        const a = SND[key];
        if (a) { a.currentTime = 0; const pr = a.play(); if (pr && pr.catch) pr.catch(() => {}); }
      } catch (e) {}
    }
    function buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

    function clampStep(dt) { return Math.min(Math.max(dt || 1, 0.25), 3); }

    function updateFX(step) {
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.age += step;
        p.x += p.vx * step; p.y += p.vy * step; p.vy += (p.g || 0) * step;
        if (p.age > p.life) parts.splice(i, 1);
      }
      for (let i = floats.length - 1; i >= 0; i--) {
        const f = floats[i];
        f.age += step; f.y -= 1.1 * step;
        if (f.age > f.life) floats.splice(i, 1);
      }
      for (let i = confetti.length - 1; i >= 0; i--) {
        const c = confetti[i];
        c.age += step;
        c.y += c.vy * step; c.x += Math.sin((c.age + c.ph) * 0.08) * 1.2 * step;
        c.rot += c.vr * step;
        if (c.y > height + 20) confetti.splice(i, 1);
      }
      if (parts.length > 260) parts.splice(0, parts.length - 260);
      shake = Math.max(0, shake - step * 1.4);
      flash = Math.max(0, flash - step * 0.07);
      if (comboPop > 0) comboPop -= step;
      for (let i = rings.length - 1; i >= 0; i--) {
        const g = rings[i];
        g.age += step; g.r += 7 * step;
        if (g.age > g.life) rings.splice(i, 1);
      }
    }

    function burst(x, y, n, colors, spd, life, g) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = spd * (0.4 + Math.random());
        parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
          age: 0, life: life * (0.6 + Math.random() * 0.8), r: 2 + Math.random() * 3.5,
          c: colors[(Math.random() * colors.length) | 0], g: g });
      }
    }

    function update(dt) {
      // dt in 60fps units (1 = one frame at 60hz)
      const step = clampStep(dt);
      updateFX(step);
      wingPhase += step * 0.35;

      for (const c of clouds) {
        c.x -= c.v * step;
        if (c.x < -90) { c.x = width + 60; c.y = 20 + Math.random() * height * 0.45; }
      }
      for (const b of dbirds) {
        b.x -= b.v * step;
        b.ph += step * 0.25;
        if (b.x < -30) { b.x = width + 20; b.y = height * 0.12 + Math.random() * height * 0.25; }
      }

      if (gameState !== 'playing') return;

      // sparkle trail, heats up with combo
      if (Math.random() < 0.7) {
        const heat = combo >= 6 ? '255,120,40' : combo >= 3 ? '255,200,60' : (Math.random() < 0.3 ? '255,215,80' : '255,255,255');
        parts.push({ x: bird.x - bird.radius, y: bird.y + (Math.random() - 0.5) * bird.radius,
          vx: -1 - Math.random() * 1.5, vy: (Math.random() - 0.5) * 1.2,
          age: 0, life: 22 + Math.random() * 16, r: 1.5 + Math.random() * 2.5 + Math.min(combo * 0.15, 2),
          c: heat, g: 0 });
      }

      bird.velocity = Math.min(bird.velocity + GRAVITY * step, MAX_FALL);
      bird.y += bird.velocity * step;
      bird.rotation = Math.max(-0.45, Math.min(1.25, bird.velocity * 0.09));
      dist += PIPE_SPEED * step;

      const now = performance.now();
      if (now - lastPipeSpawn > PIPE_SPACING_MS) { spawnPipe(); lastPipeSpawn = now; }

      const playH = height - GROUND_H;
      const hr = bird.radius * HITBOX;
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= PIPE_SPEED * step;
        if (!p.passed && p.x + PIPE_WIDTH < bird.x - bird.radius) {
          p.passed = true;
          combo++;
          comboPop = 18;
          // near-miss: thread the lip, earn the bonus
          const clearance = Math.min((bird.y - hr) - (p.gapY - PIPE_GAP / 2), (p.gapY + PIPE_GAP / 2) - (bird.y + hr));
          const nearMiss = clearance < 14;
          score += nearMiss ? 2 : 1;
          scoreEl.textContent = score;
          sfx('point'); buzz(25);
          rings.push({ x: p.x + PIPE_WIDTH / 2, y: p.gapY, r: 12, age: 0, life: 32 });
          if (nearMiss) {
            floats.push({ x: bird.x + 30, y: bird.y - 30, txt: 'CLOSE! +2', age: 0, life: 60, size: 26 });
            burst(bird.x, bird.y, 14, ['255,180,60', '255,255,255'], 3, 35, 0.02);
          } else {
            floats.push({ x: bird.x + 34, y: bird.y - 26, txt: '+1', age: 0, life: 45, size: 24 });
          }
          burst(p.x + PIPE_WIDTH / 2, p.gapY, 12, ['255,255,255', '255,215,80', '150,230,255'], 2.5, 30, 0.02);
          if (score % 5 === 0) {
            floats.push({ x: width / 2, y: height * 0.35, txt: MILESTONES[Math.min((score / 5 | 0) - 1, MILESTONES.length - 1)],
              age: 0, life: 90, size: 34 });
          }
        }
        if (bird.x + hr > p.x + 4 && bird.x - hr < p.x + PIPE_WIDTH - 4) {
          if (bird.y - hr < p.gapY - PIPE_GAP / 2 + 4 || bird.y + hr > p.gapY + PIPE_GAP / 2 - 4) {
            gameOver();
            return;
          }
        }
        if (p.x + PIPE_WIDTH < -20) pipes.splice(i, 1);
      }

      if (bird.y - bird.radius < 0) { bird.y = bird.radius; bird.velocity = 0; }
      if (bird.y + bird.radius > playH) { bird.y = playH - bird.radius; gameOver(); }
    }

    function gameOver() {
      if (gameState !== 'playing') return;
      gameState = 'over';
      overAt = performance.now();
      finalScoreEl.textContent = score;
      const isBest = score > bestScore;
      if (isBest) {
        bestScore = score;
        try { localStorage.setItem('flappy-best', String(bestScore)); } catch (e) {}
      }
      bestScoreEl.textContent = 'best: ' + bestScore;
      bestScoreEl.className = 'best-display' + (isBest && score > 0 ? ' new-best' : '');
      if (isBest && score > 0) bestScoreEl.textContent += ' — new!';
      for (const m of MEDALS) {
        if (score >= m[0]) { medalEl.textContent = m[2]; medalEl.className = m[1]; remarkEl.textContent = m[3]; break; }
      }
      // death juice: hit-stop freeze, shake, flash, feather burst, thud, confetti rain on new best
      shake = 12; flash = 0.5; hitstop = 7;
      burst(bird.x, bird.y, 26, ['255,224,102', '240,156,0', '255,255,255'], 4, 55, 0.25);
      sfx('hit'); buzz([70, 40, 90]);
      if (isBest && score > 0) {
        sfx('swoosh'); buzz([70, 40, 90, 40, 150]);
        const cols = ['255,92,92', '255,215,80', '125,217,86', '150,200,255', '200,150,255'];
        for (let i = 0; i < 90; i++) {
          confetti.push({ x: Math.random() * width, y: -20 - Math.random() * 140,
            vy: 2 + Math.random() * 2.4, ph: Math.random() * 6.28, rot: Math.random() * 6.28,
            vr: (Math.random() - 0.5) * 0.3, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
            c: cols[(Math.random() * cols.length) | 0], age: 0 });
        }
      }
      playingUI.classList.add('hidden');
      gameOverScreen.classList.remove('hidden');
    }

    function jump() {
      if (gameState === 'start') { startGame(); bird.velocity = JUMP; sfx('wing'); buzz(8); }
      else if (gameState === 'playing') { bird.velocity = JUMP; sfx('wing'); buzz(8); }
      else if (gameState === 'over' && performance.now() - overAt > 800) { startGame(); }
    }

    function startGame() {
      reset();
      gameState = 'playing';
      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      // playingUI stays hidden: score renders as sprite digits on canvas
      lastTime = 0;
      lastPipeSpawn = performance.now();
      sfx('swoosh');
      kick();
    }

    function loop(time) {
      // hit-stop: freeze a beat on death for impact
      if (hitstop > 0) {
        hitstop -= clampStep(lastTime ? (time - lastTime) / 16.667 : 1);
        lastTime = time;
        draw();
        requestAnimationFrame(loop);
        return;
      }
      if (gameState === 'over') {
        const dt = lastTime ? (time - lastTime) / 16.667 : 1;
        lastTime = time;
        updateFX(clampStep(dt));
        draw();
        if (parts.length || floats.length || confetti.length || rings.length || shake > 0.3 || flash > 0.02) {
          requestAnimationFrame(loop);
        } else {
          loopRunning = false;
        }
        return;
      }
      const dt = lastTime ? (time - lastTime) / 16.667 : 1;
      lastTime = time;
      if (gameState === 'start' && time) {
        bird.y = height * 0.3 + Math.sin(time / 350) * 10;
        bird.rotation = Math.sin(time / 350 + 1) * 0.12;
        wingPhase += 0.3 * Math.min(Math.max(dt, 0.25), 3);
      }
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function drawPipe(x, y, h) {
      if (h <= 0) return;
      const g = ctx.createLinearGradient(x, 0, x + PIPE_WIDTH, 0);
      g.addColorStop(0, '#1d7a44');
      g.addColorStop(0.18, '#37c871');
      g.addColorStop(0.42, '#a8ecbf');
      g.addColorStop(0.62, '#37c871');
      g.addColorStop(1, '#156236');
      ctx.fillStyle = g;
      ctx.fillRect(x, y, PIPE_WIDTH, h);
      ctx.strokeStyle = '#0e4d27';
      ctx.lineWidth = 3;
      ctx.strokeRect(x + 1.5, y, PIPE_WIDTH - 3, h);
    }

    function drawCap(x, y) {
      const w = PIPE_WIDTH + 10;
      const g = ctx.createLinearGradient(x, 0, x + w, 0);
      g.addColorStop(0, '#1d7a44');
      g.addColorStop(0.2, '#46d67f');
      g.addColorStop(0.45, '#b8f4cd');
      g.addColorStop(0.65, '#46d67f');
      g.addColorStop(1, '#156236');
      ctx.fillStyle = g;
      ctx.fillRect(x, y, w, 20);
      ctx.strokeStyle = '#0e4d27';
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, w, 20);
      ctx.fillStyle = '#0e4d27';
      ctx.beginPath();
      ctx.arc(x + 12, y + 10, 3, 0, Math.PI * 2);
      ctx.arc(x + w - 12, y + 10, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      const playH = height - GROUND_H;
      ctx.save();
      if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      // authentic day background sprite, stretched to fill
      if (imgOK(SPR.bg)) ctx.drawImage(SPR.bg, 0, 0, width, height);
      else { ctx.fillStyle = '#70c5ce'; ctx.fillRect(0, 0, width, height); }

      // (sun, city, hills, clouds and distant birds live inside the bg sprite)

      // get-ready art on the start screen: logo (0-48) + title (100-148) only
      if (gameState === 'start' && imgOK(SPR.msg)) {
        const mw = 184 * S * 0.8, mh = 154 * S * 0.8;
        ctx.drawImage(SPR.msg, 0, 0, 184, 154, (width - mw) / 2, height * 0.07, mw, mh);
      }

      // pipes: authentic sprite, flipped for the top pipe so the cap faces the gap
      for (const p of pipes) {
        const topH = p.gapY - PIPE_GAP / 2;
        const botY = p.gapY + PIPE_GAP / 2;
        if (imgOK(SPR.pipe)) {
          if (topH > 0) {
            ctx.save();
            ctx.translate(0, topH);
            ctx.scale(1, -1);
            ctx.drawImage(SPR.pipe, p.x, 0, PIPE_WIDTH, topH);
            ctx.restore();
          }
          if (botY < playH) ctx.drawImage(SPR.pipe, p.x, botY, PIPE_WIDTH, playH - botY);
        } else {
          ctx.fillStyle = '#2ecc71';
          if (topH > 0) ctx.fillRect(p.x, 0, PIPE_WIDTH, topH);
          if (botY < playH) ctx.fillRect(p.x, botY, PIPE_WIDTH, playH - botY);
        }
      }

      // ground: authentic scrolling base sprite, grass lip locked to the floor line
      if (imgOK(SPR.base)) {
        const gw = 336 * S, gh = 112 * S;
        let gx = -(dist % gw);
        if (gx > 0) gx -= gw;
        for (let x = gx; x < width; x += gw) ctx.drawImage(SPR.base, x, playH, gw, gh);
      } else {
        ctx.fillStyle = '#ded895';
        ctx.fillRect(0, playH, width, GROUND_H);
        ctx.fillStyle = '#9be15d';
        ctx.fillRect(0, playH, width, 14);
      }

      // bird: authentic 3-frame sprite, vector fallback if assets fail
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);
      const r = bird.radius;
      const frame = Math.floor(wingPhase / 1.2) % 3;
      const bi = SPR[frame === 0 ? 'b_up' : frame === 1 ? 'b_mid' : 'b_down'];
      if (imgOK(bi)) {
        const bw = 34 * S, bh = 24 * S;
        ctx.drawImage(bi, -bw / 2, -bh / 2, bw, bh);
      } else {
        const OL = '#543847';
        const bg2 = ctx.createRadialGradient(-r * 0.35, -r * 0.45, r * 0.15, 0, 0, r * 1.25);
        bg2.addColorStop(0, '#ffe45e');
        bg2.addColorStop(0.55, '#fbd343');
        bg2.addColorStop(1, '#f0a500');
        ctx.fillStyle = bg2;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = OL;
        ctx.lineWidth = 2.5;
        ctx.stroke();
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(r * 0.3, -r * 0.38, r * 0.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = '#1a1a2e';
        ctx.beginPath();
        ctx.arc(r * 0.4, -r * 0.36, r * 0.18, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fb6500';
        ctx.beginPath();
        ctx.moveTo(r * 0.68, -r * 0.22);
        ctx.lineTo(r * 1.48, -r * 0.05);
        ctx.lineTo(r * 0.74, r * 0.14);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = OL;
        ctx.lineWidth = 2;
        ctx.stroke();
      }
      ctx.restore();

      // sprite digit score while playing
      if (gameState === 'playing' && imgOK(SPR.d0)) {
        const ds = String(score);
        let tw = 0;
        for (const ch of ds) tw += (ch === '1' ? 16 : 24) * S + 2 * S;
        let dx = (width - tw) / 2;
        for (const ch of ds) {
          const im = SPR['d' + ch];
          const cwd = (ch === '1' ? 16 : 24) * S;
          if (imgOK(im)) ctx.drawImage(im, dx, 18, cwd, 36 * S);
          dx += cwd + 2 * S;
        }
      }

      // particles (trail sparkles, score bursts, feathers)
      for (const p of parts) {
        const a = Math.max(0, 1 - p.age / p.life);
        ctx.fillStyle = 'rgba(' + p.c + ',' + (a * 0.9).toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (0.5 + a * 0.5), 0, Math.PI * 2);
        ctx.fill();
      }

      // floating texts (+1, milestones)
      ctx.textAlign = 'center';
      for (const f of floats) {
        const a = Math.max(0, 1 - f.age / f.life);
        ctx.font = '600 ' + f.size + 'px Fredoka, "Comic Sans MS", system-ui, sans-serif';
        ctx.lineWidth = 5;
        ctx.strokeStyle = 'rgba(26,26,46,' + (a * 0.85).toFixed(2) + ')';
        ctx.strokeText(f.txt, f.x, f.y);
        ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')';
        ctx.fillText(f.txt, f.x, f.y);
      }

      // shockwave rings on pipe clear
      for (const g of rings) {
        const a = Math.max(0, 1 - g.age / g.life);
        ctx.strokeStyle = 'rgba(255,255,255,' + (a * 0.8).toFixed(2) + ')';
        ctx.lineWidth = 1 + a * 4;
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // combo meter, top-left clear of the score (shrinks on narrow screens)
      if (combo >= 2 && gameState === 'playing') {
        const pop = 1 + Math.max(0, comboPop) / 18 * 0.5;
        const heat = combo >= 6 ? '#ff7847' : combo >= 3 ? '#ffd23f' : '#fff';
        const narrow = width < 380;
        ctx.save();
        ctx.translate(narrow ? 10 : 14, narrow ? 28 : 34);
        ctx.scale(pop, pop);
        ctx.font = '600 ' + (narrow ? 15 : 20) + 'px Fredoka, system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(26,26,46,0.85)';
        ctx.strokeText('x' + combo + ' COMBO', 0, 0);
        ctx.fillStyle = heat;
        ctx.fillText('x' + combo + ' COMBO', 0, 0);
        ctx.restore();
      }

      // confetti rain (new best)
      for (const c of confetti) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.fillStyle = 'rgb(' + c.c + ')';
        ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        ctx.restore();
      }
      ctx.restore();

      // impact flash
      if (flash > 0.01) {
        ctx.fillStyle = 'rgba(255,255,255,' + Math.min(flash, 0.6).toFixed(2) + ')';
        ctx.fillRect(0, 0, width, height);
      }
    }

    let lastTouchTime = 0;
    function handleInput(e) {
      if (e.type === 'keydown' && e.code !== 'Space') return;
      if (e.target && e.target.closest && e.target.closest('button')) return;
      if (e.type === 'touchstart') lastTouchTime = Date.now();
      if (e.type === 'mousedown' && Date.now() - lastTouchTime < 500) return;
      if (e.cancelable) e.preventDefault();
      jump();
    }

    window.addEventListener('resize', () => { resize(); draw(); });
    window.addEventListener('keydown', handleInput);
    canvas.addEventListener('touchstart', handleInput, { passive: false });
    canvas.addEventListener('mousedown', handleInput);
    document.getElementById('game').addEventListener('touchstart', handleInput, { passive: false });
    startBtn.addEventListener('click', (e) => { e.stopPropagation(); jump(); });
    restartBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });

    bestScore = 0;
    try { bestScore = parseInt(localStorage.getItem('flappy-best') || '0', 10) || 0; } catch (e) {}
    bestScoreEl.textContent = 'best: ' + bestScore;
    try {
      document.getElementById('howto').textContent =
        (window.matchMedia && matchMedia('(pointer: coarse)').matches)
          ? 'tap anywhere to flap'
          : 'tap anywhere or press space to flap';
    } catch (e) {}

    resize();
    reset();
    showStart();
    draw();
  </script>
</body>
</html>
