<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>flappy bird</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      background: #70c5ce;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      position: fixed;
      width: 100%;
    }
    #game {
      position: relative;
      border: 4px solid #1a1a2e;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #1a1a2e;
      text-align: center;
      padding: 20px;
    }
    #start-screen, #game-over { pointer-events: auto; }
    h1 { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.02em; text-shadow: 0 2px 0 rgba(255,255,255,0.4); }
    .score-display { font-size: clamp(3rem, 12vw, 5rem); font-weight: 700; line-height: 1; text-shadow: 0 2px 0 rgba(255,255,255,0.4); }
    #playing-ui .score-display { margin-top: 12px; }
    .best-display { font-size: clamp(1rem, 3vw, 1.25rem); opacity: 0.7; margin-top: 0.5rem; font-weight: 600; }
    .new-best { color: #e67e22; font-weight: 700; animation: pop 0.4s ease; }
    @keyframes pop { 0% { transform: scale(0.5); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
    button {
      pointer-events: auto;
      background: #1a1a2e;
      color: #fff;
      border: none;
      padding: 1rem 2.5rem;
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      font-family: inherit;
      margin-top: 1.5rem;
      transition: transform 0.1s;
      touch-action: manipulation;
      box-shadow: 0 4px 0 #000;
    }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
    .instructions { font-size: clamp(0.875rem, 2.5vw, 1rem); opacity: 0.75; margin-top: 1rem; line-height: 1.5; font-weight: 600; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="game">
    <canvas id="canvas"></canvas>
    <div id="ui">
      <div id="start-screen">
        <h1>flappy bird</h1>
        <button id="start-btn">tap to start</button>
        <p class="instructions">tap anywhere or press space to flap</p>
      </div>
      <div id="playing-ui" class="hidden">
        <div class="score-display" id="score">0</div>
      </div>
      <div id="game-over" class="hidden">
        <h1>game over</h1>
        <div class="score-display" id="final-score">0</div>
        <div class="best-display" id="best-score">best: 0</div>
        <button id="restart-btn">play again</button>
      </div>
    </div>
  </div>

  <script>
    'use strict';
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('start-screen');
    const playingUI = document.getElementById('playing-ui');
    const gameOverScreen = document.getElementById('game-over');
    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreEl = document.getElementById('best-score');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    // tuned at 60fps units; loop scales by real elapsed time
    const GRAVITY = 0.45;
    const JUMP = -9.5;
    const MAX_FALL = 14;
    const PIPE_GAP = 160;
    const PIPE_WIDTH = 64;
    const PIPE_SPEED = 2.6;
    const PIPE_SPACING_MS = 1500;
    const GROUND_H = 60;

    let width = 320, height = 480;
    let bird, pipes, clouds, score, bestScore, gameState, lastPipeSpawn, lastTime, wingPhase;

    function resize() {
      const availW = window.innerWidth * 0.94;
      const availH = (window.innerHeight || window.outerHeight || 700) * 0.9;
      let w = Math.min(availW, 480);
      let h = Math.min(availH, 720, w * 1.5);
      w = Math.max(240, w);
      h = Math.max(360, h);
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      width = Math.round(w);
      height = Math.round(h);
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (bird) {
        bird.x = Math.round(width * 0.28);
        bird.radius = Math.max(11, Math.round(width * 0.038));
      }
    }

    function reset() {
      bird = { x: Math.round(width * 0.28), y: height / 2, velocity: 0, radius: Math.max(11, Math.round(width * 0.038)), rotation: 0 };
      pipes = [];
      clouds = [];
      for (let i = 0; i < 4; i++) clouds.push({ x: Math.random() * width, y: 20 + Math.random() * height * 0.45, s: 0.5 + Math.random() * 0.9, v: 0.2 + Math.random() * 0.4 });
      score = 0;
      wingPhase = 0;
      lastPipeSpawn = 0;
      lastTime = 0;
      scoreEl.textContent = '0';
    }

    function showStart() {
      gameState = 'start';
      startScreen.classList.remove('hidden');
      playingUI.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
    }

    function spawnPipe() {
      const margin = 90;
      const gapY = margin + PIPE_GAP / 2 + Math.random() * (height - GROUND_H - margin * 2 - PIPE_GAP);
      pipes.push({ x: width + 10, gapY: gapY, passed: false });
    }

    function update(dt) {
      // dt in 60fps units (1 = one frame at 60hz)
      const step = Math.min(Math.max(dt, 0.25), 3);
      wingPhase += step * 0.35;

      for (const c of clouds) {
        c.x -= c.v * step;
        if (c.x < -90) { c.x = width + 60; c.y = 20 + Math.random() * height * 0.45; }
      }

      if (gameState !== 'playing') return;

      bird.velocity = Math.min(bird.velocity + GRAVITY * step, MAX_FALL);
      bird.y += bird.velocity * step;
      bird.rotation = Math.max(-0.45, Math.min(1.25, bird.velocity * 0.09));

      const now = performance.now();
      if (now - lastPipeSpawn > PIPE_SPACING_MS) { spawnPipe(); lastPipeSpawn = now; }

      const playH = height - GROUND_H;
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= PIPE_SPEED * step;
        if (!p.passed && p.x + PIPE_WIDTH < bird.x - bird.radius) {
          p.passed = true;
          score++;
          scoreEl.textContent = score;
        }
        if (bird.x + bird.radius > p.x + 4 && bird.x - bird.radius < p.x + PIPE_WIDTH - 4) {
          if (bird.y - bird.radius < p.gapY - PIPE_GAP / 2 + 4 || bird.y + bird.radius > p.gapY + PIPE_GAP / 2 - 4) {
            gameOver();
            return;
          }
        }
        if (p.x + PIPE_WIDTH < -20) pipes.splice(i, 1);
      }

      if (bird.y - bird.radius < 0) { bird.y = bird.radius; bird.velocity = 0; }
      if (bird.y + bird.radius > playH) { bird.y = playH - bird.radius; gameOver(); }
    }

    function gameOver() {
      if (gameState !== 'playing') return;
      gameState = 'over';
      finalScoreEl.textContent = score;
      const isBest = score > bestScore;
      if (isBest) {
        bestScore = score;
        try { localStorage.setItem('flappy-best', String(bestScore)); } catch (e) {}
      }
      bestScoreEl.textContent = 'best: ' + bestScore;
      bestScoreEl.className = 'best-display' + (isBest && score > 0 ? ' new-best' : '');
      if (isBest && score > 0) bestScoreEl.textContent += ' — new!';
      playingUI.classList.add('hidden');
      gameOverScreen.classList.remove('hidden');
    }

    function jump() {
      if (gameState === 'start') { startGame(); bird.velocity = JUMP; }
      else if (gameState === 'playing') { bird.velocity = JUMP; }
      else if (gameState === 'over') { /* use button to restart */ }
    }

    function startGame() {
      reset();
      gameState = 'playing';
      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      playingUI.classList.remove('hidden');
      lastTime = 0;
      lastPipeSpawn = performance.now();
      requestAnimationFrame(loop);
    }

    function loop(time) {
      if (gameState !== 'playing') { draw(); return; }
      const dt = lastTime ? (time - lastTime) / 16.667 : 1;
      lastTime = time;
      update(dt);
      draw();
      if (gameState === 'playing') requestAnimationFrame(loop);
      else draw();
    }

    function drawPipe(x, y, h) {
      if (h <= 0) return;
      ctx.fillStyle = '#2ecc71';
      ctx.fillRect(x, y, PIPE_WIDTH, h);
      ctx.fillStyle = '#a9e6c3';
      ctx.fillRect(x + 8, y, 12, h);
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.fillRect(x + PIPE_WIDTH - 10, y, 10, h);
      ctx.strokeStyle = '#1e8449';
      ctx.lineWidth = 3;
      ctx.strokeRect(x + 1.5, y, PIPE_WIDTH - 3, h);
    }

    function draw() {
      const playH = height - GROUND_H;
      const grad = ctx.createLinearGradient(0, 0, 0, height);
      grad.addColorStop(0, '#5fb8c4');
      grad.addColorStop(0.75, '#a5dbe2');
      grad.addColorStop(1, '#c7e8f0');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      for (const c of clouds) {
        const r = 16 * c.s;
        ctx.beginPath();
        ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
        ctx.arc(c.x + r, c.y - r * 0.4, r * 0.75, 0, Math.PI * 2);
        ctx.arc(c.x + r * 2, c.y, r * 0.85, 0, Math.PI * 2);
        ctx.fill();
      }

      for (const p of pipes) {
        const topH = p.gapY - PIPE_GAP / 2;
        const botY = p.gapY + PIPE_GAP / 2;
        drawPipe(p.x, 0, topH);
        drawPipe(p.x, botY, playH - botY);
        ctx.fillStyle = '#27ae60';
        ctx.fillRect(p.x - 4, topH - 18, PIPE_WIDTH + 8, 18);
        ctx.fillRect(p.x - 4, botY, PIPE_WIDTH + 8, 18);
        ctx.strokeStyle = '#1e8449';
        ctx.lineWidth = 3;
        ctx.strokeRect(p.x - 4, topH - 18, PIPE_WIDTH + 8, 18);
        ctx.strokeRect(p.x - 4, botY, PIPE_WIDTH + 8, 18);
      }

      ctx.fillStyle = '#ded895';
      ctx.fillRect(0, playH, width, GROUND_H);
      ctx.fillStyle = '#9be15d';
      ctx.fillRect(0, playH, width, 14);
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      for (let x = 8; x < width; x += 34) ctx.fillRect(x, playH + 22, 18, 8);

      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);
      const r = bird.radius;
      ctx.fillStyle = '#f5b301';
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 1.15, r, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffd94d';
      ctx.beginPath();
      ctx.ellipse(-r * 0.2, -r * 0.35, r * 0.7, r * 0.5, 0, 0, Math.PI * 2);
      ctx.fill();
      const flap = Math.sin(wingPhase) * r * 0.35;
      ctx.fillStyle = '#e09c00';
      ctx.beginPath();
      ctx.ellipse(-r * 0.35, r * 0.15 + flap, r * 0.65, r * 0.38, -0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(r * 0.45, -r * 0.3, r * 0.34, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath();
      ctx.arc(r * 0.55, -r * 0.3, r * 0.16, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#e67e22';
      ctx.beginPath();
      ctx.moveTo(r * 1.05, 0);
      ctx.lineTo(r * 1.55, -r * 0.22);
      ctx.lineTo(r * 1.05, r * 0.28);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    let lastTouchTime = 0;
    function handleInput(e) {
      if (e.type === 'keydown' && e.code !== 'Space') return;
      if (e.type === 'touchstart') lastTouchTime = Date.now();
      if (e.type === 'mousedown' && Date.now() - lastTouchTime < 500) return;
      if (e.cancelable) e.preventDefault();
      jump();
    }

    window.addEventListener('resize', () => { resize(); draw(); });
    window.addEventListener('keydown', handleInput);
    canvas.addEventListener('touchstart', handleInput, { passive: false });
    canvas.addEventListener('mousedown', handleInput);
    document.getElementById('game').addEventListener('touchstart', handleInput, { passive: false });
    startBtn.addEventListener('click', (e) => { e.stopPropagation(); jump(); });
    restartBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });

    bestScore = 0;
    try { bestScore = parseInt(localStorage.getItem('flappy-best') || '0', 10) || 0; } catch (e) {}
    bestScoreEl.textContent = 'best: ' + bestScore;

    resize();
    reset();
    showStart();
    draw();
  </script>
</body>
</html>
