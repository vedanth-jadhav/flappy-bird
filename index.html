<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>flappy bird</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overscroll-behavior: none; }
    body {
      background: #70c5ce;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      position: fixed;
      width: 100%;
    }
    #game {
      position: relative;
      border: 4px solid #1a1a2e;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    @media (max-width: 560px) {
      body { justify-content: flex-start; }
      #game { border: none; border-radius: 0; box-shadow: none; }
    }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #1a1a2e;
      text-align: center;
      padding: 20px;
    }
    #start-screen, #game-over { pointer-events: auto; }
    h1 { font-size: clamp(2rem, 8vw, 3.5rem); font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.02em; text-shadow: 0 2px 0 rgba(255,255,255,0.4); }
    #start-screen h1 { animation: wob 2.4s ease-in-out infinite; display: inline-block; }
    @keyframes wob { 0%, 100% { transform: rotate(-2deg) scale(1); } 50% { transform: rotate(2deg) scale(1.05); } }
    #medal { font-size: clamp(1.6rem, 5vw, 2.2rem); }
    .score-display { font-size: clamp(3rem, 12vw, 5rem); font-weight: 700; line-height: 1; text-shadow: 0 2px 0 rgba(255,255,255,0.4); }
    #playing-ui .score-display { margin-top: 12px; }
    #playing-ui { justify-content: flex-start; padding-top: max(10px, env(safe-area-inset-top)); pointer-events: none; }
    .best-display { font-size: clamp(1rem, 3vw, 1.25rem); opacity: 0.7; margin-top: 0.5rem; font-weight: 600; }
    .new-best { color: #e67e22; font-weight: 700; animation: pop 0.4s ease; }
    @keyframes pop { 0% { transform: scale(0.5); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }
    button {
      pointer-events: auto;
      background: #1a1a2e;
      color: #fff;
      border: none;
      padding: 1rem 2.5rem;
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      font-family: inherit;
      margin-top: 1.5rem;
      transition: transform 0.1s;
      touch-action: manipulation;
      box-shadow: 0 4px 0 #000;
    }
    button:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
    .instructions { font-size: clamp(0.875rem, 2.5vw, 1rem); opacity: 0.75; margin-top: 1rem; line-height: 1.5; font-weight: 600; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="game">
    <canvas id="canvas"></canvas>
    <div id="ui">
      <div id="start-screen">
        <h1>flappy bird</h1>
        <button id="start-btn">tap to start</button>
        <p class="instructions">tap anywhere or press space to flap</p>
      </div>
      <div id="playing-ui" class="hidden">
        <div class="score-display" id="score">0</div>
      </div>
      <div id="game-over" class="hidden">
        <h1>game over</h1>
        <div class="score-display" id="final-score">0</div>
        <div class="best-display" id="medal"></div>
        <div class="best-display" id="remark"></div>
        <div class="best-display" id="best-score">best: 0</div>
        <button id="restart-btn">play again</button>
      </div>
    </div>
  </div>

  <script>
    'use strict';
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startScreen = document.getElementById('start-screen');
    const playingUI = document.getElementById('playing-ui');
    const gameOverScreen = document.getElementById('game-over');
    const scoreEl = document.getElementById('score');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreEl = document.getElementById('best-score');
    const medalEl = document.getElementById('medal');
    const remarkEl = document.getElementById('remark');
    const MEDALS = [
      [30, '💎', 'diamond legend!'],
      [20, '🥇', 'gold glider!'],
      [10, '🥈', 'silver soarer!'],
      [5, '🥉', 'bronze flapper!'],
      [1, '🐣', 'baby bird walk!'],
      [0, '🥚', 'warmup run!']
    ];
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');

    // tuned at 60fps units; loop scales by real elapsed time
    const GRAVITY = 0.42;
    const JUMP = -8;
    const MAX_FALL = 13;
    const PIPE_GAP = 185;
    const HITBOX = 0.78;
    const PIPE_WIDTH = 64;
    const PIPE_SPEED = 2.6;
    const PIPE_SPACING_MS = 1500;
    const GROUND_H = 60;

    let width = 320, height = 480;
    let bird, pipes, clouds, dbirds, score, bestScore, gameState, lastPipeSpawn, lastTime, wingPhase, overAt, dist, loopRunning;
    let parts, floats, confetti, rings, shake, flash, hitstop;
    let combo, comboPop;
    const MILESTONES = ['nice!', 'on fire!', 'unstoppable!', 'beast mode!', 'legend!', 'godlike!'];

    function resize() {
      const vw = window.innerWidth, vh = window.innerHeight || window.outerHeight || 700;
      let w, h;
      if (vw <= 560) {
        // phone: true fullscreen portrait, edge to edge
        w = vw; h = vh;
      } else {
        w = Math.min(vw * 0.94, 480);
        h = Math.min(vh * 0.9, 720, w * 1.5);
      }
      w = Math.max(240, w);
      h = Math.max(420, h);
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      width = Math.round(w);
      height = Math.round(h);
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = width + 'px';
      canvas.style.height = height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (bird) {
        bird.x = Math.round(width * 0.28);
        bird.radius = Math.max(11, Math.round(width * 0.038));
      }
    }

    function reset() {
      bird = { x: Math.round(width * 0.28), y: height / 2, velocity: 0, radius: Math.max(11, Math.round(width * 0.038)), rotation: 0 };
      pipes = [];
      clouds = [];
      for (let i = 0; i < 7; i++) {
        const far = i < 3;
        clouds.push({ x: Math.random() * width, y: 20 + Math.random() * height * 0.5,
          s: (far ? 0.35 + Math.random() * 0.4 : 0.7 + Math.random() * 0.7),
          v: (far ? 0.1 + Math.random() * 0.2 : 0.3 + Math.random() * 0.45),
          a: far ? 0.55 : 0.92 });
      }
      dbirds = [];
      for (let i = 0; i < 3; i++) {
        dbirds.push({ x: Math.random() * width, y: height * 0.12 + Math.random() * height * 0.25,
          v: 0.5 + Math.random() * 0.5, ph: Math.random() * 6.28, s: 5 + Math.random() * 4 });
      }
      score = 0;
      wingPhase = 0;
      overAt = 0;
      dist = 0;
      parts = []; floats = []; confetti = []; rings = []; shake = 0; flash = 0; hitstop = 0;
      combo = 0; comboPop = 0;
      lastPipeSpawn = 0;
      lastTime = 0;
      scoreEl.textContent = '0';
    }

    function kick() {
      if (!loopRunning) { loopRunning = true; requestAnimationFrame(loop); }
    }

    function showStart() {
      gameState = 'start';
      startScreen.classList.remove('hidden');
      playingUI.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      lastTime = 0;
      kick();
    }

    function spawnPipe() {
      const margin = 90;
      const gapY = margin + PIPE_GAP / 2 + Math.random() * (height - GROUND_H - margin * 2 - PIPE_GAP);
      pipes.push({ x: width + 10, gapY: gapY, passed: false });
    }

    // tiny synth sfx, created on first user gesture; all calls guarded
    let AC = null;
    function beep(freq, dur, type, vol, when) {
      try {
        if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
        if (AC.state === 'suspended') AC.resume();
        const t = AC.currentTime + (when || 0);
        const o = AC.createOscillator(), g = AC.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(freq, t);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(vol || 0.12, t + 0.015);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(AC.destination);
        o.start(t); o.stop(t + dur + 0.05);
      } catch (e) {}
    }
    function flapSfx() { beep(500 + Math.random() * 120, 0.07, 'triangle', 0.06); }
    function ding() { beep(880, 0.12, 'sine', 0.12); beep(1318, 0.2, 'sine', 0.1, 0.07); }
    function thud() { beep(150, 0.28, 'sawtooth', 0.1); }
    function fanfare() { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.16, 'triangle', 0.1, i * 0.09)); }

    function clampStep(dt) { return Math.min(Math.max(dt || 1, 0.25), 3); }

    function updateFX(step) {
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i];
        p.age += step;
        p.x += p.vx * step; p.y += p.vy * step; p.vy += (p.g || 0) * step;
        if (p.age > p.life) parts.splice(i, 1);
      }
      for (let i = floats.length - 1; i >= 0; i--) {
        const f = floats[i];
        f.age += step; f.y -= 1.1 * step;
        if (f.age > f.life) floats.splice(i, 1);
      }
      for (let i = confetti.length - 1; i >= 0; i--) {
        const c = confetti[i];
        c.age += step;
        c.y += c.vy * step; c.x += Math.sin((c.age + c.ph) * 0.08) * 1.2 * step;
        c.rot += c.vr * step;
        if (c.y > height + 20) confetti.splice(i, 1);
      }
      if (parts.length > 260) parts.splice(0, parts.length - 260);
      shake = Math.max(0, shake - step * 1.4);
      flash = Math.max(0, flash - step * 0.07);
      if (comboPop > 0) comboPop -= step;
      for (let i = rings.length - 1; i >= 0; i--) {
        const g = rings[i];
        g.age += step; g.r += 7 * step;
        if (g.age > g.life) rings.splice(i, 1);
      }
    }

    function burst(x, y, n, colors, spd, life, g) {
      for (let i = 0; i < n; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = spd * (0.4 + Math.random());
        parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1,
          age: 0, life: life * (0.6 + Math.random() * 0.8), r: 2 + Math.random() * 3.5,
          c: colors[(Math.random() * colors.length) | 0], g: g });
      }
    }

    function update(dt) {
      // dt in 60fps units (1 = one frame at 60hz)
      const step = clampStep(dt);
      updateFX(step);
      wingPhase += step * 0.35;

      for (const c of clouds) {
        c.x -= c.v * step;
        if (c.x < -90) { c.x = width + 60; c.y = 20 + Math.random() * height * 0.45; }
      }
      for (const b of dbirds) {
        b.x -= b.v * step;
        b.ph += step * 0.25;
        if (b.x < -30) { b.x = width + 20; b.y = height * 0.12 + Math.random() * height * 0.25; }
      }

      if (gameState !== 'playing') return;

      // sparkle trail, heats up with combo
      if (Math.random() < 0.7) {
        const heat = combo >= 6 ? '255,120,40' : combo >= 3 ? '255,200,60' : (Math.random() < 0.3 ? '255,215,80' : '255,255,255');
        parts.push({ x: bird.x - bird.radius, y: bird.y + (Math.random() - 0.5) * bird.radius,
          vx: -1 - Math.random() * 1.5, vy: (Math.random() - 0.5) * 1.2,
          age: 0, life: 22 + Math.random() * 16, r: 1.5 + Math.random() * 2.5 + Math.min(combo * 0.15, 2),
          c: heat, g: 0 });
      }

      bird.velocity = Math.min(bird.velocity + GRAVITY * step, MAX_FALL);
      bird.y += bird.velocity * step;
      bird.rotation = Math.max(-0.45, Math.min(1.25, bird.velocity * 0.09));
      dist += PIPE_SPEED * step;

      const now = performance.now();
      if (now - lastPipeSpawn > PIPE_SPACING_MS) { spawnPipe(); lastPipeSpawn = now; }

      const playH = height - GROUND_H;
      const hr = bird.radius * HITBOX;
      for (let i = pipes.length - 1; i >= 0; i--) {
        const p = pipes[i];
        p.x -= PIPE_SPEED * step;
        if (!p.passed && p.x + PIPE_WIDTH < bird.x - bird.radius) {
          p.passed = true;
          combo++;
          comboPop = 18;
          // near-miss: thread the lip, earn the bonus
          const clearance = Math.min((bird.y - hr) - (p.gapY - PIPE_GAP / 2), (p.gapY + PIPE_GAP / 2) - (bird.y + hr));
          const nearMiss = clearance < 14;
          score += nearMiss ? 2 : 1;
          scoreEl.textContent = score;
          ding();
          rings.push({ x: p.x + PIPE_WIDTH / 2, y: p.gapY, r: 12, age: 0, life: 32 });
          if (nearMiss) {
            floats.push({ x: bird.x + 30, y: bird.y - 30, txt: 'CLOSE! +2', age: 0, life: 60, size: 26 });
            burst(bird.x, bird.y, 14, ['255,180,60', '255,255,255'], 3, 35, 0.02);
          } else {
            floats.push({ x: bird.x + 34, y: bird.y - 26, txt: '+1', age: 0, life: 45, size: 24 });
          }
          burst(p.x + PIPE_WIDTH / 2, p.gapY, 12, ['255,255,255', '255,215,80', '150,230,255'], 2.5, 30, 0.02);
          if (score % 5 === 0) {
            floats.push({ x: width / 2, y: height * 0.35, txt: MILESTONES[Math.min((score / 5 | 0) - 1, MILESTONES.length - 1)],
              age: 0, life: 90, size: 34 });
          }
        }
        if (bird.x + hr > p.x + 4 && bird.x - hr < p.x + PIPE_WIDTH - 4) {
          if (bird.y - hr < p.gapY - PIPE_GAP / 2 + 4 || bird.y + hr > p.gapY + PIPE_GAP / 2 - 4) {
            gameOver();
            return;
          }
        }
        if (p.x + PIPE_WIDTH < -20) pipes.splice(i, 1);
      }

      if (bird.y - bird.radius < 0) { bird.y = bird.radius; bird.velocity = 0; }
      if (bird.y + bird.radius > playH) { bird.y = playH - bird.radius; gameOver(); }
    }

    function gameOver() {
      if (gameState !== 'playing') return;
      gameState = 'over';
      overAt = performance.now();
      finalScoreEl.textContent = score;
      const isBest = score > bestScore;
      if (isBest) {
        bestScore = score;
        try { localStorage.setItem('flappy-best', String(bestScore)); } catch (e) {}
      }
      bestScoreEl.textContent = 'best: ' + bestScore;
      bestScoreEl.className = 'best-display' + (isBest && score > 0 ? ' new-best' : '');
      if (isBest && score > 0) bestScoreEl.textContent += ' — new!';
      for (const m of MEDALS) {
        if (score >= m[0]) { medalEl.textContent = m[1]; remarkEl.textContent = m[2]; break; }
      }
      // death juice: hit-stop freeze, shake, flash, feather burst, thud, confetti rain on new best
      shake = 12; flash = 0.5; hitstop = 7;
      burst(bird.x, bird.y, 26, ['255,224,102', '240,156,0', '255,255,255'], 4, 55, 0.25);
      thud();
      if (isBest && score > 0) {
        fanfare();
        const cols = ['255,92,92', '255,215,80', '125,217,86', '150,200,255', '200,150,255'];
        for (let i = 0; i < 90; i++) {
          confetti.push({ x: Math.random() * width, y: -20 - Math.random() * 140,
            vy: 2 + Math.random() * 2.4, ph: Math.random() * 6.28, rot: Math.random() * 6.28,
            vr: (Math.random() - 0.5) * 0.3, w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
            c: cols[(Math.random() * cols.length) | 0], age: 0 });
        }
      }
      playingUI.classList.add('hidden');
      gameOverScreen.classList.remove('hidden');
    }

    function jump() {
      if (gameState === 'start') { startGame(); bird.velocity = JUMP; flapSfx(); }
      else if (gameState === 'playing') { bird.velocity = JUMP; flapSfx(); }
      else if (gameState === 'over' && performance.now() - overAt > 800) { startGame(); }
    }

    function startGame() {
      reset();
      gameState = 'playing';
      startScreen.classList.add('hidden');
      gameOverScreen.classList.add('hidden');
      playingUI.classList.remove('hidden');
      lastTime = 0;
      lastPipeSpawn = performance.now();
      kick();
    }

    function loop(time) {
      // hit-stop: freeze a beat on death for impact
      if (hitstop > 0) {
        hitstop -= clampStep(lastTime ? (time - lastTime) / 16.667 : 1);
        lastTime = time;
        draw();
        requestAnimationFrame(loop);
        return;
      }
      if (gameState === 'over') {
        const dt = lastTime ? (time - lastTime) / 16.667 : 1;
        lastTime = time;
        updateFX(clampStep(dt));
        draw();
        if (parts.length || floats.length || confetti.length || rings.length || shake > 0.3 || flash > 0.02) {
          requestAnimationFrame(loop);
        } else {
          loopRunning = false;
        }
        return;
      }
      const dt = lastTime ? (time - lastTime) / 16.667 : 1;
      lastTime = time;
      if (gameState === 'start' && time) {
        bird.y = height * 0.3 + Math.sin(time / 350) * 10;
        bird.rotation = Math.sin(time / 350 + 1) * 0.12;
        wingPhase += 0.3 * Math.min(Math.max(dt, 0.25), 3);
      }
      update(dt);
      draw();
      requestAnimationFrame(loop);
    }

    function drawPipe(x, y, h) {
      if (h <= 0) return;
      const g = ctx.createLinearGradient(x, 0, x + PIPE_WIDTH, 0);
      g.addColorStop(0, '#1d7a44');
      g.addColorStop(0.18, '#37c871');
      g.addColorStop(0.42, '#a8ecbf');
      g.addColorStop(0.62, '#37c871');
      g.addColorStop(1, '#156236');
      ctx.fillStyle = g;
      ctx.fillRect(x, y, PIPE_WIDTH, h);
      ctx.strokeStyle = '#0e4d27';
      ctx.lineWidth = 3;
      ctx.strokeRect(x + 1.5, y, PIPE_WIDTH - 3, h);
    }

    function drawCap(x, y) {
      const w = PIPE_WIDTH + 10;
      const g = ctx.createLinearGradient(x, 0, x + w, 0);
      g.addColorStop(0, '#1d7a44');
      g.addColorStop(0.2, '#46d67f');
      g.addColorStop(0.45, '#b8f4cd');
      g.addColorStop(0.65, '#46d67f');
      g.addColorStop(1, '#156236');
      ctx.fillStyle = g;
      ctx.fillRect(x, y, w, 20);
      ctx.strokeStyle = '#0e4d27';
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, w, 20);
      ctx.fillStyle = '#0e4d27';
      ctx.beginPath();
      ctx.arc(x + 12, y + 10, 3, 0, Math.PI * 2);
      ctx.arc(x + w - 12, y + 10, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      const playH = height - GROUND_H;
      ctx.save();
      if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
      const sky = ctx.createLinearGradient(0, 0, 0, height);
      sky.addColorStop(0, '#3d9bd1');
      sky.addColorStop(0.6, '#8fd0e8');
      sky.addColorStop(1, '#d8f0e8');
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, width, height);

      // sun with glow
      const sunX = width - 56, sunY = 76;
      const glow = ctx.createRadialGradient(sunX, sunY, 8, sunX, sunY, 60);
      glow.addColorStop(0, 'rgba(255,236,150,0.9)');
      glow.addColorStop(1, 'rgba(255,236,150,0)');
      ctx.fillStyle = glow;
      ctx.fillRect(sunX - 60, sunY - 60, 120, 120);
      ctx.fillStyle = '#ffdf5e';
      ctx.beginPath();
      ctx.arc(sunX, sunY, 26, 0, Math.PI * 2);
      ctx.fill();
      // slow rotating sun rays
      ctx.save();
      ctx.translate(sunX, sunY);
      ctx.rotate(performance.now() / 9000);
      ctx.fillStyle = 'rgba(255,236,150,0.16)';
      for (let i = 0; i < 8; i++) {
        ctx.rotate(Math.PI / 4);
        ctx.beginPath();
        ctx.moveTo(30, -7);
        ctx.lineTo(58, 0);
        ctx.lineTo(30, 7);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();

      // distant hills
      ctx.fillStyle = '#6fb894';
      ctx.beginPath();
      ctx.ellipse(width * 0.15, playH + 30, width * 0.42, 110, 0, Math.PI, Math.PI * 2);
      ctx.ellipse(width * 0.85, playH + 30, width * 0.48, 140, 0, Math.PI, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#5aa782';
      ctx.beginPath();
      ctx.ellipse(width * 0.55, playH + 30, width * 0.4, 90, 0, Math.PI, Math.PI * 2);
      ctx.fill();
      // bushes along the hill line
      ctx.fillStyle = '#4c946f';
      for (let i = 0; i < 6; i++) {
        const bx = width * (0.06 + i * 0.17) + ((i * 53) % 20);
        const br = 13 + ((i * 29) % 12);
        ctx.beginPath();
        ctx.arc(bx, playH + 4, br, Math.PI, Math.PI * 2);
        ctx.fill();
      }

      // clouds (far layer fainter)
      for (const c of clouds) {
        ctx.fillStyle = 'rgba(255,255,255,' + c.a + ')';
        const r = 15 * c.s;
        ctx.beginPath();
        ctx.arc(c.x, c.y, r, 0, Math.PI * 2);
        ctx.arc(c.x + r * 1.1, c.y - r * 0.45, r * 0.72, 0, Math.PI * 2);
        ctx.arc(c.x + r * 2.1, c.y, r * 0.85, 0, Math.PI * 2);
        ctx.arc(c.x + r * 1.1, c.y + r * 0.35, r * 0.8, 0, Math.PI * 2);
        ctx.fill();
      }

      // distant birds drifting by
      ctx.strokeStyle = 'rgba(40,70,90,0.55)';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      for (const b of dbirds) {
        const w = Math.sin(b.ph) * b.s * 0.5;
        ctx.beginPath();
        ctx.moveTo(b.x - b.s, b.y - w);
        ctx.quadraticCurveTo(b.x - b.s * 0.3, b.y + 1, b.x, b.y);
        ctx.quadraticCurveTo(b.x + b.s * 0.3, b.y + 1, b.x + b.s, b.y - w);
        ctx.stroke();
      }

      // pipes
      for (const p of pipes) {
        const topH = p.gapY - PIPE_GAP / 2;
        const botY = p.gapY + PIPE_GAP / 2;
        drawPipe(p.x, 0, topH);
        drawPipe(p.x, botY, playH - botY);
        if (topH > 0) drawCap(p.x - 5, topH - 20);
        if (botY < playH) drawCap(p.x - 5, botY);
      }

      // ground: dirt, grass lip, scrolling dashes
      ctx.fillStyle = '#e3d184';
      ctx.fillRect(0, playH, width, GROUND_H);
      const dg = ctx.createLinearGradient(0, playH, 0, height);
      dg.addColorStop(0, 'rgba(0,0,0,0)');
      dg.addColorStop(1, 'rgba(120,80,20,0.25)');
      ctx.fillStyle = dg;
      ctx.fillRect(0, playH, width, GROUND_H);
      ctx.fillStyle = '#7dd956';
      ctx.fillRect(0, playH, width, 16);
      ctx.fillStyle = '#5cb531';
      ctx.fillRect(0, playH + 16, width, 5);
      ctx.fillStyle = 'rgba(120,80,20,0.35)';
      const off = dist % 40;
      for (let x = -40 + off; x < width + 40; x += 40) {
        ctx.fillRect(x, playH + 32, 22, 9);
      }
      ctx.fillStyle = 'rgba(0,0,0,0.15)';
      ctx.fillRect(0, playH, width, 3);

      // bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);
      const r = bird.radius;
      // tail
      ctx.fillStyle = '#e09c00';
      ctx.beginPath();
      ctx.moveTo(-r * 1.05, -r * 0.1);
      ctx.lineTo(-r * 1.6, -r * 0.45);
      ctx.lineTo(-r * 1.45, r * 0.15);
      ctx.closePath();
      ctx.fill();
      // body with gradient
      const bg = ctx.createRadialGradient(-r * 0.3, -r * 0.4, r * 0.2, 0, 0, r * 1.3);
      bg.addColorStop(0, '#ffe066');
      bg.addColorStop(0.6, '#f5b301');
      bg.addColorStop(1, '#d18f00');
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.ellipse(0, 0, r * 1.15, r * 0.95, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#8a5f00';
      ctx.lineWidth = 2;
      ctx.stroke();
      // belly
      ctx.fillStyle = '#fff3c4';
      ctx.beginPath();
      ctx.ellipse(r * 0.1, r * 0.45, r * 0.62, r * 0.42, 0, 0, Math.PI * 2);
      ctx.fill();
      // wing (two-frame flap)
      const up = Math.sin(wingPhase) > 0;
      ctx.fillStyle = '#f08c00';
      ctx.strokeStyle = '#8a5f00';
      ctx.lineWidth = 2;
      ctx.beginPath();
      if (up) ctx.ellipse(-r * 0.25, -r * 0.45, r * 0.62, r * 0.34, -0.6, 0, Math.PI * 2);
      else ctx.ellipse(-r * 0.3, r * 0.35, r * 0.62, r * 0.34, 0.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      // eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(r * 0.42, -r * 0.32, r * 0.36, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#8a5f00';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#1a1a2e';
      ctx.beginPath();
      ctx.arc(r * 0.52, -r * 0.32, r * 0.17, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(r * 0.57, -r * 0.38, r * 0.06, 0, Math.PI * 2);
      ctx.fill();
      // beak
      ctx.fillStyle = '#f76707';
      ctx.beginPath();
      ctx.moveTo(r * 1.02, -r * 0.12);
      ctx.lineTo(r * 1.6, r * 0.02);
      ctx.lineTo(r * 1.02, r * 0.3);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#a61e00';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      // cheek
      ctx.fillStyle = 'rgba(240,98,0,0.35)';
      ctx.beginPath();
      ctx.arc(r * 0.15, r * 0.05, r * 0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // particles (trail sparkles, score bursts, feathers)
      for (const p of parts) {
        const a = Math.max(0, 1 - p.age / p.life);
        ctx.fillStyle = 'rgba(' + p.c + ',' + (a * 0.9).toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * (0.5 + a * 0.5), 0, Math.PI * 2);
        ctx.fill();
      }

      // floating texts (+1, milestones)
      ctx.textAlign = 'center';
      for (const f of floats) {
        const a = Math.max(0, 1 - f.age / f.life);
        ctx.font = '700 ' + f.size + 'px Space Grotesk, system-ui, sans-serif';
        ctx.lineWidth = 5;
        ctx.strokeStyle = 'rgba(26,26,46,' + (a * 0.85).toFixed(2) + ')';
        ctx.strokeText(f.txt, f.x, f.y);
        ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(2) + ')';
        ctx.fillText(f.txt, f.x, f.y);
      }

      // shockwave rings on pipe clear
      for (const g of rings) {
        const a = Math.max(0, 1 - g.age / g.life);
        ctx.strokeStyle = 'rgba(255,255,255,' + (a * 0.8).toFixed(2) + ')';
        ctx.lineWidth = 1 + a * 4;
        ctx.beginPath();
        ctx.arc(g.x, g.y, g.r, 0, Math.PI * 2);
        ctx.stroke();
      }

      // combo meter, top-left clear of the score
      if (combo >= 2 && gameState === 'playing') {
        const pop = 1 + Math.max(0, comboPop) / 18 * 0.5;
        const heat = combo >= 6 ? '#ff7847' : combo >= 3 ? '#ffd23f' : '#fff';
        ctx.save();
        ctx.translate(14, 34);
        ctx.scale(pop, pop);
        ctx.font = '700 20px Space Grotesk, system-ui, sans-serif';
        ctx.textAlign = 'left';
        ctx.lineWidth = 4;
        ctx.strokeStyle = 'rgba(26,26,46,0.85)';
        ctx.strokeText('x' + combo + ' COMBO', 0, 0);
        ctx.fillStyle = heat;
        ctx.fillText('x' + combo + ' COMBO', 0, 0);
        ctx.restore();
      }

      // confetti rain (new best)
      for (const c of confetti) {
        ctx.save();
        ctx.translate(c.x, c.y);
        ctx.rotate(c.rot);
        ctx.fillStyle = 'rgb(' + c.c + ')';
        ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
        ctx.restore();
      }
      ctx.restore();

      // impact flash
      if (flash > 0.01) {
        ctx.fillStyle = 'rgba(255,255,255,' + Math.min(flash, 0.6).toFixed(2) + ')';
        ctx.fillRect(0, 0, width, height);
      }
    }

    let lastTouchTime = 0;
    function handleInput(e) {
      if (e.type === 'keydown' && e.code !== 'Space') return;
      if (e.target && e.target.closest && e.target.closest('button')) return;
      if (e.type === 'touchstart') lastTouchTime = Date.now();
      if (e.type === 'mousedown' && Date.now() - lastTouchTime < 500) return;
      if (e.cancelable) e.preventDefault();
      jump();
    }

    window.addEventListener('resize', () => { resize(); draw(); });
    window.addEventListener('keydown', handleInput);
    canvas.addEventListener('touchstart', handleInput, { passive: false });
    canvas.addEventListener('mousedown', handleInput);
    document.getElementById('game').addEventListener('touchstart', handleInput, { passive: false });
    startBtn.addEventListener('click', (e) => { e.stopPropagation(); jump(); });
    restartBtn.addEventListener('click', (e) => { e.stopPropagation(); startGame(); });

    bestScore = 0;
    try { bestScore = parseInt(localStorage.getItem('flappy-best') || '0', 10) || 0; } catch (e) {}
    bestScoreEl.textContent = 'best: ' + bestScore;

    resize();
    reset();
    showStart();
    draw();
  </script>
</body>
</html>
